<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A5C4F0" />
      <stop offset="100%" stop-color="#2F6BFF" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22E4F0" />
      <stop offset="100%" stop-color="#FF4FA3" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="48" fill="#0B1B3A" stroke="url(#chromeRing)" stroke-width="4" />
  <!-- Inner Telemetry Grid Marks -->
  <circle cx="50" cy="50" r="38" stroke="#1E386B" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- Stylized Speedometer / F1 Wing Silhouette -->
  <path d="M22 62 L42 36 L58 36 L78 62 L66 62 L55 46 L45 46 L34 62 Z" fill="url(#neonGlow)" />
  <!-- Speed Needle -->
  <line x1="50" y1="50" x2="68" y2="30" stroke="#B6FF3B" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" stroke="#0B1B3A" stroke-width="2" />
  <!-- 4-point Sparkle -->
  <path d="M72 20 Q72 26 78 26 Q72 26 72 32 Q72 26 66 26 Q72 26 72 20 Z" fill="#22E4F0" />
</svg>
