name: Free Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within the 7-day auto-pause limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Supabase REST Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive health check query
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Secrets not configured yet. Skipping keep-alive ping."
            exit 0
          fi
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/groups?select=id&limit=1")
          
          echo "Supabase responded with HTTP status: $RESPONSE"
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Keep-alive ping successful. Database is awake."
          else
            echo "Unexpected status code $RESPONSE. Check Supabase status."
          fi

      # Prevent GitHub from disabling scheduled workflows after 60 days of repo inactivity
      - name: Prevent scheduled workflow auto-disable (Repo Keepalive)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          committer_email: "actions@github.com"
          committer_username: "GitHub Actions"
          commit_message: "chore: automated repo activity ping [skip ci]"

# Free External Fallback (Zero Credit Card):
# If repository is ever unmaintained or archived, register a free 72-hour HTTP ping on:
# https://cron-job.org (Free tier, zero card required)
# Target URL: https://<project-ref>.supabase.co/rest/v1/groups?select=id&limit=1
# Header: apikey: <SUPABASE_ANON_KEY>
